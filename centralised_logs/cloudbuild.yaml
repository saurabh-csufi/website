# Cloud Build configuration for Centralized Log Collector
# Run from centralised_logs/ folder:
#   gcloud builds submit --config cloudbuild.yaml
#
# Or from website root:
#   gcloud builds submit --config centralised_logs/cloudbuild.yaml centralised_logs/

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/log-collector:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/log-collector:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/log-collector:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/log-collector:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'log-collector'
      - '--image'
      - 'gcr.io/$PROJECT_ID/log-collector:$BUILD_ID'
      - '--platform'
      - 'managed'
      - '--region'
      - 'asia-south1'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '300'

images:
  - 'gcr.io/$PROJECT_ID/log-collector:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/log-collector:latest'

options:
  logging: CLOUD_LOGGING_ONLY
